# Silent Auth SAS — runtime config (demo defaults)
quarkus.http.port=8085

# The micro-container is built by adapter-quarkus from its build-time config;
# defaults apply here (see MicroJainsleeRecorder / MicroSleeConfiguration).
# P1 security config (bank→SAS northbound)
sas.security.token-validation-enabled=false
sas.security.hmac-secret=
sas.security.expected-issuer=
sas.security.expected-audience=
sas.security.required-scopes=
sas.security.clock-skew-seconds=30
sas.security.replay-window-seconds=300
sas.security.reqid-ttl-seconds=600

# P2 transport selection — memory (default, pilot) or real signalling transport.
# Fail-closed: unknown values fall back to the in-memory backend.
sas.transport.map=memory
sas.transport.s6a=memory
sas.transport.swx=memory
# jSS7 (MAP) — used when sas.transport.map=jss7
sas.transport.jss7.config=
sas.transport.jss7.hlr-gt=251911000000
sas.transport.jss7.local-gt=251911999999
# Diameter (S6a/SWx) — used when sas.transport.s6a=corsac / swx=corsac
sas.transport.diameter.peer-host=127.0.0.1
sas.transport.diameter.peer-port=3868
sas.transport.diameter.origin-host=sas.restlink.et
sas.transport.diameter.realm=restlink.et
sas.transport.diameter.destination-host=hss.restlink.et
sas.transport.diameter.destination-realm=restlink.et
# --- SAS admin dashboard persistence (H2 lab; switch to postgres in prod) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/sas-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.packages=et.restlink.sas.persist
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.config.mapping.validate-unknown=false
