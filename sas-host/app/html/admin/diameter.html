<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Diameter — Digicom-ET SAS</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sas-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {theme:{extend:{colors:{
      ink:{DEFAULT:'#0c1220',panel:'#141c2b',line:'#243044',mute:'#7a8ba3'},
      signal:{DEFAULT:'#e8a317',dim:'#b87f0f'}
    },fontFamily:{display:['"DM Sans"','system-ui','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']}}}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="/admin/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script defer src="/admin/static/sas-shell.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
</head>
<body x-data="diameterCtl()" class="min-h-full bg-ink font-display text-slate-200 antialiased"
      style="background-image:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(232,163,23,0.08),transparent),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(56,100,160,0.12),transparent)">
  <header class="sticky top-0 z-40 border-b border-ink-line/80 bg-ink/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="h-8 w-1 rounded-full bg-signal" aria-hidden="true"></span>
        <h1 class="text-lg font-semibold text-slate-100">Diameter</h1>
      </div>
      <nav class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-ink-mute">{{NAV_LINKS}}</nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8" x-data="{ busy: false }">
    {{NOTICE}}
    <div id="diameter-status" class="mb-6">{{DIAMETER_STATUS}}</div>

    <section aria-labelledby="diameter-config">
      <p class="text-xs uppercase tracking-[0.25em] text-signal">Multi-realm / multi-app source of truth</p>
      <div class="mt-2">
        <h2 id="diameter-config" class="text-xl font-semibold text-slate-50">Active diameter.json</h2>
        <p class="mt-1 max-w-3xl text-sm text-ink-mute">
          Validate + persist + hot-reload. Invalid JSON keeps the last-good config (fail-closed).
        </p>
        <textarea id="diameter-json" rows="22" spellcheck="false"
                  class="mt-5 w-full rounded-lg border border-ink-line bg-ink-panel p-4 font-mono text-xs leading-relaxed text-slate-200 focus:border-signal focus:outline-none focus:ring-1 focus:ring-signal/30">{{DIAMETER_JSON}}</textarea>
        <div class="mt-4 flex flex-wrap gap-3">
          <button type="button" @click="save()" :disabled="busy"
                  class="rounded-md bg-signal px-4 py-2 text-sm font-semibold text-ink hover:bg-signal-dim disabled:opacity-50">Save &amp; reload</button>
          <button type="button" @click="reload()" :disabled="busy"
                  class="rounded-md border border-ink-line px-4 py-2 text-sm text-slate-200 hover:border-signal hover:text-signal disabled:opacity-50">Reload active JSON</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    function diameterCtl() {
      return {
        busy: false,
        statusEl() { return document.getElementById('diameter-status'); },
        async save() {
          this.busy = true;
          const json = document.getElementById('diameter-json').value;
          const res = await window.SasAdmin.postJson('/admin/diameter', json);
          this.busy = false;
          if (res.ok) {
            window.SasAdmin.toast('diameter.json saved + reloaded', 'ok');
          } else {
            window.SasAdmin.toastErrors(res.data && res.data.errors ? res.data.errors : [String(res.data && res.data.error || res.raw)], 'Diameter invalid');
          }
          window.SasAdmin.refreshLinks('#diameter-status', '/admin/diameter');
        },
        async reload() {
          this.busy = true;
          const res = await window.SasAdmin.postJson('/admin/diameter', JSON.stringify({ action: 'apply' }));
          this.busy = false;
          if (res.ok) {
            window.SasAdmin.toast('diameter.json reloaded', 'ok');
          } else {
            window.SasAdmin.toastErrors([String(res.data && res.data.error || res.raw)], 'Reload failed');
          }
        }
      };
    }
  </script>
</body>
</html>
