# sas-camara (sas-host) — PRODUCTION profile (P-H1/P-H2/P-H4/P-H6 closure).
# The entitlement server (sas-ecs) has its own profile in sas-ecs-host.
#
# Activate with:  QUARKUS_PROFILE=prod  (or -Dquarkus.profile=prod)
#   java -Dquarkus.profile=prod -jar sas-host/target/quarkus-app/quarkus-run.jar
#
# Design rule of this file: it carries NO lab defaults. Every credential and
# operator-specific value is a required environment variable — `${VAR}` with no
# `:default`. If the variable is missing, SmallRye Config fails the read and the
# JVM refuses to start (fail-closed at boot). Run the preflight BEFORE starting
# the JVM to get a readable list instead of a config stack trace:
#   python3 harness/preflight_prod.py
#
# This profile overrides application.properties key-by-key; anything not listed
# here keeps the base value (budgets, weights, thresholds, TTL caps).

# ---------------------------------------------------------------------------
# P-H1 — transport: HTTPS only, no cleartext on the bank→SAS surface.
# Property names verified against quarkus-vertx-http 3.37.3 (VertxHttpConfig).
# ---------------------------------------------------------------------------
quarkus.http.ssl.certificate.key-store-file=${SAS_TLS_KEYSTORE}
quarkus.http.ssl.certificate.key-store-password=${SAS_TLS_KEYSTORE_PASSWORD}
quarkus.http.ssl.certificate.key-store-key-password=${SAS_TLS_KEYSTORE_KEY_PASSWORD}
quarkus.http.ssl.certificate.key-store-file-type=${SAS_TLS_KEYSTORE_TYPE:PKCS12}
quarkus.http.ssl-port=${SAS_HTTPS_PORT:8443}
# `disabled` = the cleartext socket answers nothing at all (enabled|redirect|disabled)
quarkus.http.insecure-requests=disabled
# mTLS bank→SAS. Keep `required` unless the bank has no client cert yet;
# `none` is NOT an accepted production value (preflight rejects it).
quarkus.http.ssl.client-auth=${SAS_TLS_CLIENT_AUTH:required}
# CAMARA security profile: TLS 1.2 or better on every connection (PRO-37).
quarkus.http.ssl.protocols=TLSv1.3,TLSv1.2
quarkus.http.ssl.certificate.trust-store-file=${SAS_TLS_TRUSTSTORE}
quarkus.http.ssl.certificate.trust-store-password=${SAS_TLS_TRUSTSTORE_PASSWORD}
# NOTE (P-H1b): Quarkus core does NOT emit `Strict-Transport-Security` (verified:
# no HSTS key in quarkus-vertx-http 3.37.3). HSTS must be terminated at the edge
# proxy (`Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`)
# until an app-level JAX-RS response filter lands. Tracked in sas-host/TODO.md.

# ---------------------------------------------------------------------------
# P-H1 — northbound auth: real token validation + per-tenant API keys ON.
# Base profile ships token-validation-enabled=false (lab). Here it is true, so
# VerifyResource enforces signature/exp/iss/aud, per-endpoint CAMARA scope,
# user-number binding (F4), amr fail-closed, single-use + replay + idempotency.
# ---------------------------------------------------------------------------
sas.security.token-validation-enabled=true
# Access tokens are ES256 from our own Authorization Server (JWKS). HS256 bearer tokens
# signed with a shared secret are refused unless explicitly re-enabled for a bank IdP
# migration (then PRO-05 demands a strong out-of-band secret).
sas.security.accept-hs256=${SAS_SECURITY_ACCEPT_HS256:false}
# NV: mobile-network authentication is read from the signed token amr only, never from
# the caller's X-Sas-Amr header (PRO-37).
sas.security.trust-amr-header=false
sas.security.hmac-secret=${SAS_SECURITY_HMAC_SECRET:}
sas.security.expected-issuer=${SAS_SECURITY_ISSUER}
sas.security.expected-audience=${SAS_SECURITY_AUDIENCE}
# required-scopes stays EMPTY on purpose: it is a global AND-gate across all
# endpoints. Per-endpoint scopes (number-verification:verify vs
# ...device-phone-number:read) are enforced in VerifyResource/TokenValidator;
# pinning one here would break the other.
sas.security.clock-skew-seconds=30
sas.security.replay-window-seconds=120
sas.security.reqid-ttl-seconds=600
sas.security.enforce-api-keys=true
# tenantId=key,tenantId=key — one entry per Ethiopian bank in the pilot.
sas.tenants.api-keys=${SAS_TENANT_API_KEYS}

# ---------------------------------------------------------------------------
# P-H2 — admin dashboard: rotated key, real session secret, secure cookies.
# Base defaults (`sas.admin.key=change-me`, dev HMAC secret, cookieSecure=false)
# are deliberately replaced with required env values.
# ---------------------------------------------------------------------------
sas.admin.key=${SAS_ADMIN_KEY}
sas.admin.session-hmac-secret=${SAS_ADMIN_SESSION_HMAC_SECRET}
sas.admin.cookie-secure=true

# ---------------------------------------------------------------------------
# Subscriber exposure (layered ADR §4). This gateway runs no MAP/Diameter/SCTP stack;
# every subscriber fact comes from the entitlement server. HTTPS only (PRO-36); client
# authentication (mTLS + client credentials) arrives in migration step M4.
# ---------------------------------------------------------------------------
sas.exposure.client.base-url=${SAS_EXPOSURE_BASE_URL}
sas.exposure.client.af-id=${SAS_EXPOSURE_AF_ID:sas-camara}
sas.policy.home-plmn=${SAS_HOME_PLMN}
sas.policy.location-max-age-minutes=${SAS_LOCATION_MAX_AGE_MINUTES:1440}

# ---------------------------------------------------------------------------
# OAuth Authorization Server (CAMARA ICM) — ES256 only, keys from the secret store.
# PRO-24 (signing key), PRO-31 (client auth), PRO-32 (operator-token acceptance).
# ---------------------------------------------------------------------------
sas.oauth.public-base-url=${SAS_OAUTH_PUBLIC_BASE_URL}
sas.oauth.signing-alg=ES256
sas.oauth.signing-jwk=${SAS_OAUTH_SIGNING_JWK}
sas.oauth.previous-jwks=${SAS_OAUTH_PREVIOUS_JWKS:}
sas.oauth.allow-ephemeral-signing-key=false
sas.oauth.access-token-audience=${SAS_SECURITY_AUDIENCE}
sas.oauth.pairwise-secret=${SAS_OAUTH_PAIRWISE_SECRET}
sas.oauth.require-client-auth=true
sas.oauth.clients-json=${SAS_OAUTH_CLIENTS_JSON}
# /authorize identifies the subscriber by the connection source. Set true ONLY when an
# edge proxy overwrites X-Sas-Src-Ip/X-Sas-Src-Port with the real post-CGNAT tuple.
sas.oauth.authorize.trust-src-header=${SAS_AUTHORIZE_TRUST_SRC_HEADER:false}
# Operator tokens: redeemed at the entitlement server (D3) — no key or ledger here.
# The direct-bearer and header forms are lab-only extensions (D6).
sas.operator-token.enabled=true
sas.operator-token.direct-bearer-enabled=false
sas.operator-token.header-enabled=false

# ---------------------------------------------------------------------------
# CAMARA OneTimePasswordSMS (fallback OTP) — OFF in production.
# Two reasons, both fail-closed: (1) the only wired delivery seam is the lab
# log-only sender — the SMS must go out over the operator's own SMSC/SGd route
# (TS 29.338) behind Home Routing + signalling FW (SG.22), and Restlink does
# not wholesale SMS; (2) the OTP attempt store is in-memory, so a restart would
# drop live attempts. Preflight PRO-29 refuses enabled=true with a lab sender;
# both keys are on the CRITICAL_KEYS list so dropping them here (reverting to
# the lab defaults enabled=true + delivery=log) fails PRO-02 as well.
# ---------------------------------------------------------------------------
sas.otp.enabled=false
sas.otp.sms-delivery=${SAS_OTP_SMS_DELIVERY:log}
sas.otp.code-length=6
sas.otp.ttl-seconds=${SAS_OTP_TTL_SECONDS:300}
sas.otp.max-attempts=${SAS_OTP_MAX_ATTEMPTS:3}
sas.otp.max-codes-per-number=${SAS_OTP_MAX_CODES_PER_NUMBER:3}
sas.otp.rate-window-seconds=3600

# ---------------------------------------------------------------------------
# P-H6 / P-H7 — persistence and auditability: PostgreSQL, not the H2 lab file.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SAS_DB_JDBC_URL}
quarkus.datasource.username=${SAS_DB_USER}
quarkus.datasource.password=${SAS_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=32
quarkus.hibernate-orm.packages=et.restlink.sas.persist
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
sas.cdr.enabled=true
sas.cdr.db.enabled=true
sas.cdr.db.queue-cap=${SAS_CDR_QUEUE_CAP:100000}
sas.cdr.db.batch-size=${SAS_CDR_BATCH_SIZE:500}
sas.log.dir=${SAS_LOG_DIR:/var/log/sas}
# Assurance detail is NOT part of the CAMARA contract: off in production,
# opt-in per request via X-Sas-Assurance-Detail.
sas.api.assurance-detail-enabled=false

sas.admin.password.bcrypt-cost=${SAS_ADMIN_BCRYPT_COST:12}
