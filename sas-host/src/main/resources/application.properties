# sas-camara (sas-host) — CAMARA server + OAuth AS — runtime config (LAB defaults).
# The TS.43 entitlement server is the separate sas-ecs binary (sas-ecs-host, :8095).
quarkus.http.port=8085
quarkus.jackson.fail-on-unknown-properties=true

# The micro-container is built by adapter-quarkus from its build-time config;
# defaults apply here (see MicroJainsleeRecorder / MicroSleeConfiguration).
# P1 security config (bank→SAS northbound)
sas.security.token-validation-enabled=false
sas.security.clock-skew-seconds=30
sas.security.replay-window-seconds=300
sas.security.reqid-ttl-seconds=600

# --- Subscriber exposure (layered ADR §4) ----------------------------------------
# This gateway signals no core network: every subscriber fact comes from the
# entitlement server's exposure API. LAB: sas-ecs on loopback, plain HTTP; prod needs
# HTTPS (PRO-36) and, from migration step M4, mTLS + client credentials.
sas.exposure.client.base-url=http://127.0.0.1:8095/sas-subscriber-exposure/v1
sas.exposure.client.af-id=sas-camara
# Location policy on the evidence metadata (ADR R8): home PLMN and the oldest location
# update that still counts as plausible.
sas.policy.home-plmn=63601
sas.policy.location-max-age-minutes=1440

# Assurance weights + per-risk thresholds (P2 #8; runtime-editable via admin KV store)
# w-ip-fresh + w-reachable + w-not-sim-swap + w-location must sum to 1.0
# thresholds: LOGIN <= TRANSFER <= HIGH_VALUE, percent 0..100
# Absent keys take defaults; invalid values fall back to defaults() wholesale.
# --- OAuth Authorization Server (CAMARA ICM) -------------------------------
# ES256 access + ID tokens, published at /jwks.json. LAB: a random key per process.
sas.oauth.public-base-url=http://127.0.0.1:8085
sas.oauth.signing-alg=ES256
sas.oauth.allow-ephemeral-signing-key=true
sas.oauth.access-token-audience=http://127.0.0.1:8085/camara
# Authorization Code flow (NV): LAB drives /authorize with curl, so the edge headers
# X-Sas-Src-Ip/Port are trusted here. Prod trusts them only behind an edge proxy.
sas.oauth.authorize.trust-src-header=true
# Resource server: lab keeps accepting HS256 test tokens signed with hmac-secret.
sas.security.accept-hs256=true
# --- Operator tokens (CAMARA ICM operatortoken:) ---------------------------------
# Redeemed at the entitlement server (D3): no key, issuer list or ledger here.
# LAB ONLY (D6): the direct `Authorization: Bearer operatortoken:` form on /verify.
sas.operator-token.enabled=true
sas.operator-token.direct-bearer-enabled=true
# Machine-endpoint API keys (empty = lab-open; enforce=true rejects all when key blank)
sas.security.enforce-api-keys=false
# --- CAMARA OneTimePasswordSMS (OTP SMS fallback) — LAB ONLY ----------------
# The SAS orchestrates the fallback OTP (policy, attempt state, validation);
# the SMS itself belongs to the operator SMSC — Restlink does not wholesale SMS.
# `log` = lab sender: the composed message is written to the log and NOTHING is
# sent. Prod ships this surface OFF and the preflight refuses a lab sender
# (PRO-29) until a real SMSC/SGd adapter (TS 29.338) + persistent store exist.
sas.otp.enabled=true
sas.otp.sms-delivery=log
sas.otp.code-length=6
sas.otp.ttl-seconds=300
sas.otp.max-attempts=3
sas.otp.max-codes-per-number=3
sas.otp.rate-window-seconds=3600
# --- SAS admin dashboard persistence (H2 lab; switch to postgres in prod) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/sas-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.packages=et.restlink.sas.persist
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.config.mapping.validate-unknown=false
