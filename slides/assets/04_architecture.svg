<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470">
  <rect width="840" height="470" fill="#FFF8E7" rx="12"/>
  
  <rect x="0" y="0" width="840" height="6.0" fill="#078930"/>
  <rect x="0" y="6.0" width="840" height="6.0" fill="#FCDD09"/>
  <rect x="0" y="12.0" width="840" height="6.0" fill="#DA121A"/>

  <defs>
    <marker id="arch-down" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C9A227"/>
    </marker>
    <marker id="arch-right" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#078930"/>
    </marker>
  </defs>
  <text x="420" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">
    Digicom-ET — adapter layer above Ethio Telecom
  </text>
  <text x="420" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0D7377">
    Banks call Digicom API · Operator core stays unchanged
  </text>

  <!-- Layer 1: Banks -->
  <rect x="40" y="88" width="760" height="72" rx="10" fill="#078930" opacity="0.12" stroke="#078930" stroke-width="2"/>
  <text x="60" y="112" font-size="13" font-weight="bold" fill="#078930" font-family="Arial,sans-serif">BANK LAYER</text>
  <rect x="180" y="98" width="130" height="52" rx="8" fill="#078930"/>
  <text x="245" y="120" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">CBE</text>
  <text x="245" y="138" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">Bank App</text>
  <rect x="330" y="98" width="130" height="52" rx="8" fill="#078930"/>
  <text x="395" y="120" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Awash</text>
  <text x="395" y="138" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">Bank App</text>
  <rect x="480" y="98" width="130" height="52" rx="8" fill="#078930"/>
  <text x="545" y="120" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Dashen</text>
  <text x="545" y="138" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">Bank App</text>
  <text x="680" y="128" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">← customers</text>

  <!-- API call arrow down -->
  <line x1="420" y1="160" x2="420" y2="188" stroke="#078930" stroke-width="3" marker-end="url(#arch-right)"/>
  <text x="520" y="178" font-size="11" fill="#078930" font-family="Arial,sans-serif" font-weight="bold">REST API · per-verify billing</text>

  <!-- Layer 2: Digicom adapter (above telco) -->
  <rect x="40" y="188" width="760" height="88" rx="10" fill="#0D7377" opacity="0.15" stroke="#0D7377" stroke-width="3"/>
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#0D7377" font-family="Arial,sans-serif">DIGICOM-ET ADAPTER (VAS)</text>
  <rect x="120" y="218" width="600" height="48" rx="8" fill="#0D7377"/>
  <text x="420" y="238" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Silent Auth Service — Resolver · Verifier · Fallback orchestrator</text>
  <text x="420" y="256" text-anchor="middle" font-size="11" fill="#FFF8E7" font-family="Arial,sans-serif">Sits above operator signalling — does not replace HLR/HSS/PGW</text>

  <!-- signalling down -->
  <line x1="300" y1="276" x2="300" y2="304" stroke="#C9A227" stroke-width="2.5" marker-end="url(#arch-down)"/>
  <line x1="420" y1="276" x2="420" y2="304" stroke="#C9A227" stroke-width="2.5" marker-end="url(#arch-down)"/>
  <line x1="540" y1="276" x2="540" y2="304" stroke="#C9A227" stroke-width="2.5" marker-end="url(#arch-down)"/>
  <text x="620" y="294" font-size="10" fill="#C9A227" font-family="Arial,sans-serif">MAP / Diameter / PGW</text>

  <!-- Layer 3: Ethio Telecom -->
  <rect x="40" y="304" width="760" height="72" rx="10" fill="#1A1A2E" opacity="0.9"/>
  <text x="60" y="328" font-size="13" font-weight="bold" fill="#FCDD09" font-family="Arial,sans-serif">ETHIO TELECOM CORE (unchanged)</text>
  <text x="420" y="352" text-anchor="middle" font-size="12" fill="#FFF8E7" font-family="Arial,sans-serif">HLR · HSS · PGW · SMSC · SS7 / Diameter interconnect</text>

  <!-- money note -->
  <rect x="60" y="392" width="720" height="58" rx="10" fill="#FFFFFF" stroke="#078930" stroke-width="2"/>
  <text x="420" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#078930" font-family="Arial,sans-serif">
    Digicom does NOT take telecom revenue — SMS &amp; interconnect stay with Ethio Telecom
  </text>
  <text x="420" y="436" text-anchor="middle" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">
    Digicom bills banks for auth API · Operator keeps existing SMS revenue on fallback
  </text>

</svg>
