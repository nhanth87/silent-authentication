<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
  <rect width="820" height="410" fill="#FFF8E7" rx="12"/>
  
  <rect x="0" y="0" width="820" height="6.0" fill="#078930"/>
  <rect x="0" y="6.0" width="820" height="6.0" fill="#FCDD09"/>
  <rect x="0" y="12.0" width="820" height="6.0" fill="#DA121A"/>

  <defs>
    <marker id="money-flow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C9A227"/>
    </marker>
  </defs>
  <text x="410" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">
    Commercial model — everyone's pocket stays whole
  </text>
  <text x="410" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0D7377">
    Separate revenue streams · No cannibalization of operator SMS income
  </text>

  <rect x="40" y="88" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#078930" stroke-width="3"/>
  <rect x="40" y="88" width="230" height="44" rx="12" fill="#078930"/>
  <rect x="40" y="112" width="230" height="20" fill="#078930"/>
  <text x="155" y="118" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Ethio Telecom</text>
  <rect x="60" y="142" width="190" height="22" rx="6" fill="#078930" opacity="0.15"/>
  <text x="155" y="157" text-anchor="middle" font-size="10" fill="#078930" font-family="Arial,sans-serif" font-weight="bold">SMS $ stays here</text>
<text x="58" y="188" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Keeps ALL SMS interconnect revenue</text><text x="58" y="220" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Keeps data &amp; signalling revenue</text><text x="58" y="252" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Digicom = partner VAS layer</text><text x="58" y="284" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• New auth API share (optional)</text>
  <rect x="290" y="88" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#0D7377" stroke-width="3"/>
  <rect x="290" y="88" width="230" height="44" rx="12" fill="#0D7377"/>
  <rect x="290" y="112" width="230" height="20" fill="#0D7377"/>
  <text x="405" y="118" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Digicom-ET</text>
  <rect x="310" y="142" width="190" height="22" rx="6" fill="#0D7377" opacity="0.15"/>
  <text x="405" y="157" text-anchor="middle" font-size="10" fill="#0D7377" font-family="Arial,sans-serif" font-weight="bold">Auth API $</text>
<text x="308" y="188" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Bills banks per Silent Auth verify</text><text x="308" y="220" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Adapter — NOT a carrier</text><text x="308" y="252" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Orchestrates fallback policy</text><text x="308" y="284" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Does NOT take telco pocket</text>
  <rect x="540" y="88" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
  <rect x="540" y="88" width="230" height="44" rx="12" fill="#C9A227"/>
  <rect x="540" y="112" width="230" height="20" fill="#C9A227"/>
  <text x="655" y="118" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Banks</text>
  <rect x="560" y="142" width="190" height="22" rx="6" fill="#C9A227" opacity="0.15"/>
  <text x="655" y="157" text-anchor="middle" font-size="10" fill="#C9A227" font-family="Arial,sans-serif" font-weight="bold">Pays for value</text>
<text x="558" y="188" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Pay Digicom for auth API</text><text x="558" y="220" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Fewer SMS OTP sends overall</text><text x="558" y="252" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Higher login success rate</text><text x="558" y="284" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Lower fraud &amp; abandonment</text>
  <path d="M 270 200 Q 280 170 290 200" fill="none" stroke="#C9A227" stroke-width="2" marker-end="url(#money-flow)"/>
  <text x="280" y="168" text-anchor="middle" font-size="9" fill="#C9A227" font-family="Arial,sans-serif">API share</text>
  <path d="M 520 200 Q 530 230 540 200" fill="none" stroke="#C9A227" stroke-width="2.5" marker-end="url(#money-flow)"/>
  <text x="530" y="248" text-anchor="middle" font-size="10" fill="#C9A227" font-family="Arial,sans-serif" font-weight="bold">per-verify billing</text>

  <!-- SMS revenue stays with telco -->
  <rect x="40" y="330" width="350" height="56" rx="10" fill="#078930" opacity="0.12" stroke="#078930" stroke-width="2"/>
  <text x="215" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#078930" font-family="Arial,sans-serif">
    SMS revenue → Ethio Telecom (unchanged)
  </text>
  <text x="215" y="374" text-anchor="middle" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">
    Fallback OTP SMS still billed through operator interconnect
  </text>

  <!-- Auth API revenue -->
  <rect x="410" y="330" width="370" height="56" rx="10" fill="#0D7377" opacity="0.12" stroke="#0D7377" stroke-width="2"/>
  <text x="595" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D7377" font-family="Arial,sans-serif">
    Auth API revenue → Digicom-ET (new stream)
  </text>
  <text x="595" y="374" text-anchor="middle" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">
    Banks pay for Silent Auth · Digicom does not compete with telco SMS
  </text>

</svg>
