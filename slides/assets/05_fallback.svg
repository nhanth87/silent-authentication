<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450">
  <rect width="820" height="450" fill="#FFF8E7" rx="12"/>
  
  <rect x="0" y="0" width="820" height="6.0" fill="#078930"/>
  <rect x="0" y="6.0" width="820" height="6.0" fill="#FCDD09"/>
  <rect x="0" y="12.0" width="820" height="6.0" fill="#DA121A"/>

  <defs>
    <marker id="fb-yes" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#078930"/>
    </marker>
    <marker id="fb-no" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DA121A"/>
    </marker>
  </defs>
  <text x="410" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">
    Fallback policy — Silent Auth first, SMS OTP only if needed
  </text>
  <text x="410" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0D7377">
    ~95%+ succeed silently · SMS is the exception, not the default
  </text>

  <!-- Step 1: Always try silent first -->
  <rect x="290" y="88" width="240" height="56" rx="10" fill="#0D7377" stroke="#C9A227" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="14" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">1. Try Silent Auth</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#FFF8E7" font-family="Arial,sans-serif">Digicom verifies via cellular session</text>
  <line x1="410" y1="144" x2="410" y2="168" stroke="#C9A227" stroke-width="2.5"/>

  <!-- Decision diamond -->
  <polygon points="410,168 490,210 410,252 330,210" fill="#FCDD09" stroke="#C9A227" stroke-width="2"/>
  <text x="410" y="206" text-anchor="middle" font-size="12" fill="#1A1A2E" font-family="Arial,sans-serif" font-weight="bold">Cellular</text>
  <text x="410" y="222" text-anchor="middle" font-size="12" fill="#1A1A2E" font-family="Arial,sans-serif" font-weight="bold">path OK?</text>

  <!-- YES branch -->
  <line x1="330" y1="210" x2="140" y2="210" stroke="#078930" stroke-width="3" marker-end="url(#fb-yes)"/>
  <text x="230" y="200" text-anchor="middle" font-size="12" fill="#078930" font-family="Arial,sans-serif" font-weight="bold">YES</text>
  <rect x="30" y="178" width="110" height="64" rx="10" fill="#078930"/>
  <text x="85" y="204" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">Approve</text>
  <text x="85" y="222" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">No SMS</text>
  <text x="85" y="236" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">&lt; 3 sec</text>

  <!-- NO branch -->
  <line x1="490" y1="210" x2="680" y2="210" stroke="#DA121A" stroke-width="3" marker-end="url(#fb-no)"/>
  <text x="580" y="200" text-anchor="middle" font-size="12" fill="#DA121A" font-family="Arial,sans-serif" font-weight="bold">NO</text>
  <rect x="680" y="178" width="120" height="64" rx="10" fill="#DA121A"/>
  <text x="740" y="204" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="bold">SMS OTP</text>
  <text x="740" y="222" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">Fallback only</text>
  <text x="740" y="236" text-anchor="middle" font-size="10" fill="#FFF8E7" font-family="Arial,sans-serif">via operator</text>

  <!-- Failure reasons -->
  <rect x="520" y="268" width="260" height="100" rx="10" fill="#FFFFFF" stroke="#DA121A" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="650" y="290" text-anchor="middle" font-size="12" fill="#DA121A" font-family="Arial,sans-serif" font-weight="bold">When Silent Auth fails</text>
  <text x="540" y="312" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• User on Wi-Fi only (no cellular data path)</text>
  <text x="540" y="332" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• MVNO / roaming edge cases</text>
  <text x="540" y="352" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Network timeout or resolver miss</text>

  <!-- Success path highlight -->
  <rect x="30" y="268" width="260" height="100" rx="10" fill="#078930" opacity="0.08" stroke="#078930" stroke-width="1.5"/>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#078930" font-family="Arial,sans-serif" font-weight="bold">Happy path (majority)</text>
  <text x="50" y="312" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Cellular session proves SIM ownership</text>
  <text x="50" y="332" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Zero user friction — no code to type</text>
  <text x="50" y="352" font-size="11" fill="#1A1A2E" font-family="Arial,sans-serif">• Resistant to SMS intercept attacks</text>

  <rect x="80" y="388" width="660" height="44" rx="8" fill="#F3F4F6" stroke="#0D7377" stroke-width="1"/>
  <text x="410" y="408" text-anchor="middle" font-size="12" fill="#1A1A2E" font-family="Arial,sans-serif">
    Fallback SMS still routes through Ethio Telecom — Digicom orchestrates policy, not billing
  </text>
  <text x="410" y="424" text-anchor="middle" font-size="11" fill="#0D7377" font-family="Arial,sans-serif">
    Operator keeps SMS revenue · Digicom keeps auth API revenue
  </text>

</svg>
