<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390">
  <rect width="820" height="390" fill="#FFF8E7" rx="12"/>
  
  <rect x="0" y="0" width="820" height="6.0" fill="#078930"/>
  <rect x="0" y="6.0" width="820" height="6.0" fill="#FCDD09"/>
  <rect x="0" y="12.0" width="820" height="6.0" fill="#DA121A"/>

  <text x="410" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E">
    Before vs After — Digicom Silent Auth
  </text>

  <!-- BEFORE panel -->
  <rect x="30" y="68" width="360" height="300" rx="14" fill="#FFFFFF" stroke="#DA121A" stroke-width="2.5"/>
  <rect x="30" y="68" width="360" height="36" rx="14" fill="#DA121A"/>
  <rect x="30" y="88" width="360" height="16" fill="#DA121A"/>
  <text x="210" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Arial,sans-serif">BEFORE — SMS OTP every login</text>

  <text x="55" y="130" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">① Open bank app</text>
  <text x="55" y="158" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">② Wait for SMS… (3–30 sec)</text>
  <text x="55" y="186" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">③ Find SMS, type 6-digit code</text>
  <text x="55" y="214" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">④ Hope OTP wasn't intercepted</text>

  <!-- SMS icon crossed -->
  <g transform="translate(210, 240)">
    
  <rect x="-30.800000000000004" y="-17.6" width="61.60000000000001" height="35.2" rx="6" fill="#0D7377"/>
  <polygon points="-8.8,17.6 0,30.800000000000004 8.8,17.6" fill="#0D7377"/>
  <text x="0" y="4.4" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="13.200000000000001" fill="#FFFFFF" font-weight="bold">SMS OTP</text>

  <line x1="-35.2" y1="-24.200000000000003" x2="35.2" y2="30.800000000000004"
        stroke="#DA121A" stroke-width="4.4" stroke-linecap="round"/>

  </g>
  <text x="210" y="296" text-anchor="middle" font-size="12" fill="#DA121A" font-family="Arial,sans-serif" font-weight="bold">~5–30 sec · friction · fraud risk</text>
  <text x="210" y="318" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Arial,sans-serif">SS7 intercept · SIM swap · phishing</text>
  <text x="210" y="352" text-anchor="middle" font-size="11" fill="#DA121A" font-family="Arial,sans-serif">Users abandon login</text>

  <!-- Arrow divider -->
  <polygon points="410,218 430,200 430,236" fill="#C9A227"/>
  <text x="420" y="260" text-anchor="middle" font-size="11" fill="#C9A227" font-family="Arial,sans-serif" font-weight="bold" transform="rotate(90 420 260)">Digicom</text>

  <!-- AFTER panel -->
  <rect x="430" y="68" width="360" height="300" rx="14" fill="#FFFFFF" stroke="#078930" stroke-width="2.5"/>
  <rect x="430" y="68" width="360" height="36" rx="14" fill="#078930"/>
  <rect x="430" y="88" width="360" height="16" fill="#078930"/>
  <text x="610" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Arial,sans-serif">AFTER — Silent Auth default</text>

  <text x="455" y="130" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">① Open app on cellular</text>
  <text x="455" y="158" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">② Digicom verifies silently</text>
  <text x="455" y="186" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">③ Login approved — done</text>
  <text x="455" y="214" font-size="13" fill="#1A1A2E" font-family="Arial,sans-serif">④ SMS only on rare fallback</text>

  <!-- Lock + check -->
  <g transform="translate(580, 248)">
    
  <rect x="-14.0" y="-4.0" width="28.0" height="24.0" rx="3" fill="#078930"/>
  <path d="M -8.0,-4.0 V -16.0 A 8.0 8.0 0 0 1 8.0 -16.0 V -4.0"
        fill="none" stroke="#1A1A2E" stroke-width="3.0"/>
  <circle cx="0" cy="6.0" r="4.0" fill="#FFF8E7"/>

    <path d="M 18 -8 L 26 0 L 42 -16" fill="none" stroke="#078930" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="610" y="296" text-anchor="middle" font-size="12" fill="#078930" font-family="Arial,sans-serif" font-weight="bold">&lt; 3 sec · zero typing · nothing to steal</text>
  <text x="610" y="318" text-anchor="middle" font-size="11" fill="#0D7377" font-family="Arial,sans-serif">Live SIM proof · no OTP in the flow</text>
  <text x="610" y="352" text-anchor="middle" font-size="11" fill="#078930" font-family="Arial,sans-serif">Higher conversion · lower fraud</text>

</svg>
