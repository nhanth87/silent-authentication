<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#FFF8E7" rx="8"/>
  
  <defs>
    <marker id="ts-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C9A227"/>
    </marker>
    <marker id="ts-arr-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#C9A227"/>
    </marker>
  </defs>

  <text x="400.0" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15"
        font-weight="bold" fill="#1A1A2E">Two-stage architecture — MAP cannot resolve IP→MSISDN</text>

  <text x="400" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6B7280">
    IP:port:ts ──[Resolver]──► MSISDN/IMSI ──[Verifier]──► assurance
  </text>

  <rect x="60" y="90" width="280" height="130" rx="6" fill="#FFFFFF" stroke="#078930" stroke-width="2"/>
  <text x="200.0" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"
        font-weight="bold" fill="#078930">Resolver</text>
  <line x1="68" y1="120" x2="332" y2="120" stroke="#078930" stroke-width="1" opacity="0.4"/>

  <text x="72" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">Input:  srcIP, srcPort, ts</text>

  <text x="72" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">Source: PGW / GGSN / CGNAT</text>

  <text x="72" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">Output: MSISDN, IMSI, bearerAge</text>

  <rect x="460" y="90" width="280" height="130" rx="6" fill="#FFFFFF" stroke="#0D7377" stroke-width="2"/>
  <text x="600.0" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13"
        font-weight="bold" fill="#0D7377">Verifier</text>
  <line x1="468" y1="120" x2="732" y2="120" stroke="#0D7377" stroke-width="1" opacity="0.4"/>

  <text x="472" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">Input:  MSISDN / IMSI</text>

  <text x="472" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">MAP:    ATI / PSI / SAI</text>

  <text x="472" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1A1A2E">Diam:   IDR / AIR (S6a)</text>

  <line x1="340" y1="155" x2="454" y2="155" stroke="#078930" stroke-width="2"
        marker-end="url(#ts-arr)"/>
  <text x="400.0" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">MSISDN + IMSI</text>
  

  <rect x="120" y="240" width="560" height="44" rx="6" fill="#DA121A14" stroke="#DA121A" stroke-width="1.5"/>
  <text x="400" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#DA121A" font-weight="bold">
    MAP / Diameter cannot map IP → MSISDN
  </text>
  <text x="400" y="276" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">
    PGW session binding required · Verifier only checks subscriber state
  </text>

</svg>
