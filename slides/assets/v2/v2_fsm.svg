<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FFF8E7" rx="8"/>
  
  <defs>
    <marker id="fsm-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C9A227"/>
    </marker>
    <marker id="fsm-arr-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#C9A227"/>
    </marker>
  </defs>

  <text x="400.0" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15"
        font-weight="bold" fill="#1A1A2E">SAS per-request state machine</text>

  <rect x="100" y="120" width="120" height="56" rx="8" fill="#0D7377" opacity="0.15" stroke="#0D7377" stroke-width="2"/>
  <text x="160" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
        font-weight="bold" fill="#0D7377">RESOLVING</text>
  <text x="160" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1A1A2E">IP→MSISDN lookup</text>

  <rect x="280" y="120" width="120" height="56" rx="8" fill="#078930" opacity="0.15" stroke="#078930" stroke-width="2"/>
  <text x="340" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
        font-weight="bold" fill="#078930">VERIFYING</text>
  <text x="340" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1A1A2E">MAP/Diameter dialog</text>

  <rect x="460" y="120" width="120" height="56" rx="8" fill="#C9A227" opacity="0.15" stroke="#C9A227" stroke-width="2"/>
  <text x="520" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
        font-weight="bold" fill="#C9A227">SCORING</text>
  <text x="520" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1A1A2E">Policy weights</text>

  <rect x="640" y="120" width="120" height="56" rx="8" fill="#078930" opacity="0.15" stroke="#078930" stroke-width="2"/>
  <text x="700" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
        font-weight="bold" fill="#078930">APPROVED</text>
  <text x="700" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1A1A2E">assurance ≥ threshold</text>

  <line x1="220" y1="148" x2="274" y2="148" stroke="#C9A227" stroke-width="2"
        marker-end="url(#fsm-arr)"/>
  
  

  <line x1="400" y1="148" x2="454" y2="148" stroke="#C9A227" stroke-width="2"
        marker-end="url(#fsm-arr)"/>
  
  

  <line x1="580" y1="148" x2="634" y2="148" stroke="#C9A227" stroke-width="2"
        marker-end="url(#fsm-arr)"/>
  
  

  <rect x="280" y="240" width="240" height="56" rx="8" fill="#DA121A18" stroke="#DA121A" stroke-width="2"/>
  <text x="400" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" fill="#DA121A">FALLBACK</text>
  <text x="400" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">SMS OTP / TOTP / Passkey</text>

  <line x1="160" y1="176" x2="160" y2="234" stroke="#DA121A" stroke-width="2" stroke-dasharray="5,4"
        marker-end="url(#fsm-arr)"/>
  <text x="168" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">no binding</text>

  <line x1="340" y1="176" x2="340" y2="234" stroke="#DA121A" stroke-width="2" stroke-dasharray="5,4"
        marker-end="url(#fsm-arr)"/>
  <text x="348" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">timeout</text>

  <line x1="520" y1="176" x2="520" y2="234" stroke="#DA121A" stroke-width="2" stroke-dasharray="5,4"
        marker-end="url(#fsm-arr)"/>
  <text x="528" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1A1A2E">low score</text>

  <text x="400" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6B7280">
    Fail-closed: any stage without evidence → FALLBACK · no partial approvals
  </text>
  <text x="400" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6B7280">
    One MAP/Diameter dialog max per stage · reqId idempotency
  </text>

</svg>
