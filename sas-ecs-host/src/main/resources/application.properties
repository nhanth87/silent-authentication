# sas-ecs (sas-ecs-host) — Restlink TS.43 entitlement server — runtime config (LAB).
# Deployed only when the operator has no entitlement server of its own (mode 2).
# The CAMARA server is the separate sas-camara binary (sas-host, :8085); the two
# meet only through the operator token (sas-token profile) published at /jwks.json.
quarkus.http.port=8095
quarkus.jackson.fail-on-unknown-properties=true
quarkus.config.mapping.validate-unknown=false

# --- Signalling (own stacks, independent of sas-camara) ---------------------
# Auth vectors: memory (LAB — fabricated, refused by PRO-30) | map (MAP SAI, own HLR)
# | corsac (Diameter SWx MAR, own HSS).
sas.transport.authvector=memory
sas.transport.map=memory
sas.transport.s6a=memory
sas.transport.swx=memory
sas.transport.resolver=memory
# IMSI -> MSISDN confirmation order. map-smi = MAP SendIMSI; db = read-only export.
# SRI-SM and ATI are not legal sources (Home Routing / FS.11 Category 1).
sas.binding.source-order=db
# sas.binding.subscriber-db-path=configs/subscribers.json   (JSON: {"<imsi>":"+E164"})
# jSS7 (MAP) — own association (local SCTP 2907) — used when authvector=map or map-smi
# sas.transport.jss7.config=configs/ss7-ecs.json
sas.transport.jss7.hlr-gt=251911000000
sas.transport.jss7.local-gt=251911999998
# Diameter SWx — own Origin-Host, used when authvector=corsac
sas.transport.diameter.peer-host=127.0.0.1
sas.transport.diameter.peer-port=3868
sas.transport.diameter.origin-host=ecs.restlink.et
sas.transport.diameter.realm=restlink.et
sas.transport.diameter.destination-host=hss.restlink.et
sas.transport.diameter.destination-realm=restlink.et

# --- Entitlement + operator tokens ------------------------------------------
sas.entitlement.enabled=true
sas.entitlement.token-format=operator-jwe
sas.entitlement.token-ttl-seconds=300
sas.entitlement.require-signed=true
sas.ecs.issuer=http://127.0.0.1:8095
# LAB: random signing key per process; sas-camara fetches it from /jwks.json.
sas.ecs.allow-ephemeral-signing-key=true
# The CAMARA server the tokens are for, and its PUBLIC encryption key (LAB key).
sas.ecs.token.audience=http://127.0.0.1:8085
sas.ecs.token.recipient-enc-jwk={"crv":"P-256","kty":"EC","x":"dGmbW1ZmixgbvQxNoqj8CU81sU6Jz2C_PiMTNRIs5SE","y":"xQgpnfv_JkZCiBPBPDVR5vPhSUrp71AFNrlRSELNGHA","kid":"lab-camara-enc-15MyGALDGMZ8","use":"enc","alg":"ECDH-ES"}
sas.ecs.token.allow-unencrypted=false

# Machine-endpoint API keys for /entitlement/issue + /exchange (LAB: open)
sas.security.enforce-api-keys=false

# Subscriber exposure API (layered ADR §4, M2). Lab only until M4 adds mTLS + client
# credentials; the prod profile pins it off and preflight PRO-35 refuses it.
sas.exposure.enabled=true
sas.subscriber.monitoring-via=map
# D3: this ECS redeems its own tokens. Off until M3 switches the gateway side over;
# turn on per run (-Dsas.ecs.token.redeem-at-ecs=true) to exercise /operator-token/redeem.
sas.ecs.token.redeem-at-ecs=false
