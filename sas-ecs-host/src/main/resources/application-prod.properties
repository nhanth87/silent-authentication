# sas-ecs (sas-ecs-host) — PRODUCTION profile.
#
# Activate with QUARKUS_PROFILE=prod. Same rule as sas-camara: no lab defaults, every
# credential and operator-specific value is a required environment variable.
# Run the gate first:  python3 harness/preflight_prod.py --service ecs

# --- device/AAA-facing transport: HTTPS only ---------------------------------
quarkus.http.ssl.certificate.key-store-file=${ECS_TLS_KEYSTORE}
quarkus.http.ssl.certificate.key-store-password=${ECS_TLS_KEYSTORE_PASSWORD}
quarkus.http.ssl.certificate.key-store-key-password=${ECS_TLS_KEYSTORE_KEY_PASSWORD}
quarkus.http.ssl.certificate.key-store-file-type=${ECS_TLS_KEYSTORE_TYPE:PKCS12}
quarkus.http.ssl-port=${ECS_HTTPS_PORT:8443}
quarkus.http.insecure-requests=disabled
# /ts43 is device-facing (a handset has no client certificate) → client-auth=request:
# the AAA-facing /entitlement/issue is then protected by API key + attestation MAC.
quarkus.http.ssl.client-auth=${ECS_TLS_CLIENT_AUTH:request}
quarkus.http.ssl.certificate.trust-store-file=${ECS_TLS_TRUSTSTORE}
quarkus.http.ssl.certificate.trust-store-password=${ECS_TLS_TRUSTSTORE_PASSWORD}

# --- signalling: real operator paths only (PRO-30) ---------------------------
sas.transport.authvector=${ECS_TRANSPORT_AUTHVECTOR}
sas.transport.swx=${ECS_TRANSPORT_SWX:memory}
sas.transport.map=${ECS_TRANSPORT_MAP:memory}
sas.binding.source-order=${ECS_BINDING_SOURCE_ORDER:map-smi,db}
# Read-only IMSI -> MSISDN export (last resort, can only be stale).
sas.binding.subscriber-db-path=${ECS_SUBSCRIBER_DB_PATH:}
sas.transport.jss7.config=${ECS_JSS7_CONFIG:}
sas.transport.jss7.hlr-gt=${ECS_JSS7_HLR_GT:}
sas.transport.jss7.local-gt=${ECS_JSS7_LOCAL_GT:}
sas.transport.diameter.peer-host=${ECS_DIAMETER_PEER_HOST:}
sas.transport.diameter.peer-port=${ECS_DIAMETER_PEER_PORT:3868}
sas.transport.diameter.origin-host=${ECS_DIAMETER_ORIGIN_HOST:}
sas.transport.diameter.realm=${ECS_DIAMETER_REALM:}
sas.transport.diameter.destination-host=${ECS_DIAMETER_DESTINATION_HOST:}
sas.transport.diameter.destination-realm=${ECS_DIAMETER_DESTINATION_REALM:}

# --- entitlement + operator tokens (PRO-22, PRO-23) ---------------------------
sas.entitlement.enabled=true
sas.entitlement.token-format=operator-jwe
sas.entitlement.token-ttl-seconds=300
sas.entitlement.require-signed=true
sas.entitlement.issue-attestation-required=true
sas.entitlement.issue-attestation-secret=${ECS_ATTESTATION_SECRET}
sas.ecs.issuer=${ECS_ISSUER}
sas.ecs.signing-jwk=${ECS_SIGNING_JWK}
sas.ecs.allow-ephemeral-signing-key=false
sas.ecs.token.audience=${ECS_TOKEN_AUDIENCE}
sas.ecs.token.recipient-enc-jwk=${ECS_TOKEN_RECIPIENT_ENC_JWK}
sas.ecs.token.allow-unencrypted=false
# The CAMARA server is the only consumer of operator tokens (its ledger is authoritative).
sas.entitlement.legacy-exchange-enabled=false

# --- machine endpoints --------------------------------------------------------
sas.security.enforce-api-keys=true
sas.security.api-key=${ECS_API_KEYS}
sas.log.dir=${ECS_LOG_DIR:/var/log/sas-ecs}

# Subscriber exposure: no client authentication before M4 — pinned off (PRO-35).
sas.exposure.enabled=false
sas.ecs.token.redeem-at-ecs=false
